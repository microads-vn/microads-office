    # >>> microads-office >>>
    # Trang tải & cập nhật Microads Office: microads.vn/office (PHP, pool riêng php8.5-fpm-office).
    #   /office/api/manifest.json → api.php (ứng dụng kiểm tra phiên bản)
    #   /office/download/<tệp>    → download.php đếm lượt tải rồi nginx gửi tệp (X-Accel-Redirect)
    #                               MicroadsOffice_Setup.exe = trình cài đặt trực tuyến (không bao giờ đổi)
    #   /office/install.ps1       → install.php (lệnh PowerShell: irm https://microads.vn/office/install.ps1 | iex)
    #   /office/admin/            → trang quản trị (phát hành, cập nhật toàn bộ, quảng bá, bài viết & SEO)
    #   /office/en/               → trang chủ tiếng Anh (index.php?hl=en)
    #   /office/blog/…, /office/en/blog/… → blog.php (danh sách, bài viết, feed.xml)
    #   /office/sitemap.xml       → sitemap.php · /office/<khóa>.txt → indexnow.php
    #   /office/en/excel-formula-generator, /office/cong-cu/tao-cong-thuc-excel → tool.php; /office/api/formula → tool-api.php
    # Dữ liệu và bộ cài nằm NGOÀI web root: /var/www/microads-office-data
    location = /office { return 301 /office/; }
    location ^~ /office/ {
        client_max_body_size 310m;
        rewrite ^/office/en$ /office/en/ permanent;
        rewrite ^/office/en/$ /office/index.php?hl=en last;
        rewrite ^/office/blog$ /office/blog/ permanent;
        rewrite ^/office/en/blog$ /office/en/blog/ permanent;
        rewrite ^/office/blog/$ /office/blog.php?hl=vi last;
        rewrite ^/office/en/blog/$ /office/blog.php?hl=en last;
        rewrite ^/office/blog/feed\.xml$ /office/blog.php?hl=vi&feed=1 last;
        rewrite ^/office/en/blog/feed\.xml$ /office/blog.php?hl=en&feed=1 last;
        rewrite ^/office/blog/([a-z0-9-]+)/?$ /office/blog.php?hl=vi&slug=$1 last;
        rewrite ^/office/en/blog/([a-z0-9-]+)/?$ /office/blog.php?hl=en&slug=$1 last;
        rewrite ^/office/sitemap\.xml$ /office/sitemap.php last;
        rewrite ^/office/en/excel-formula-generator$ /office/tool.php?hl=en last;
        rewrite ^/office/cong-cu/tao-cong-thuc-excel$ /office/tool.php?hl=vi last;
        rewrite ^/office/api/formula$ /office/tool-api.php last;
        rewrite "^/office/([0-9a-f]{32})\.txt$" /office/indexnow.php?k=$1 last;
        location ^~ /office/inc/ { deny all; return 404; }
        location = /office/api/manifest.json { rewrite ^ /office/api.php last; }
        location = /office/privacy { rewrite ^ /office/privacy.php last; }
        location = /office/install.ps1 { rewrite ^ /office/install.php last; }
        location = /office/code-signing { rewrite ^ /office/code-signing.php last; }
        location ^~ /office/download/ { rewrite ^/office/download/([^/]+)$ /office/download.php?f=$1 last; return 404; }
        location ^~ /office/assets/ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
        location ~ ^/office/.+\.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.5-fpm-office.sock;
            fastcgi_read_timeout 300s;
        }
        try_files $uri $uri/ =404;
    }
    location ^~ /office-files-internal/ {
        internal;
        alias /var/www/microads-office-data/releases/;
    }
    # <<< microads-office <<<

