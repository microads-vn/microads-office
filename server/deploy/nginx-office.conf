    # >>> microads-office >>>
    # Trang tải & cập nhật Microads Office: microads.vn/office (PHP, pool riêng php8.5-fpm-office).
    #   /office/api/manifest.json → api.php (ứng dụng kiểm tra phiên bản)
    #   /office/download/<tệp>    → download.php đếm lượt tải rồi nginx gửi tệp (X-Accel-Redirect)
    #                               MicroadsOffice_Setup.exe = trình cài đặt trực tuyến (không bao giờ đổi)
    #   /office/install.ps1       → install.php (lệnh PowerShell: irm https://microads.vn/office/install.ps1 | iex)
    #   /office/admin/            → trang quản trị (phát hành, cập nhật toàn bộ, quảng bá)
    # Dữ liệu và bộ cài nằm NGOÀI web root: /var/www/microads-office-data
    location = /office { return 301 /office/; }
    location ^~ /office/ {
        client_max_body_size 310m;
        location ^~ /office/inc/ { deny all; return 404; }
        location = /office/api/manifest.json { rewrite ^ /office/api.php last; }
        location = /office/privacy { rewrite ^ /office/privacy.php last; }
        location = /office/install.ps1 { rewrite ^ /office/install.php last; }
        location = /office/code-signing { rewrite ^ /office/code-signing.php last; }
        location ^~ /office/download/ { rewrite ^/office/download/([^/]+)$ /office/download.php?f=$1 last; return 404; }
        location ^~ /office/assets/ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
        location ~ ^/office/.+\.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.5-fpm-office.sock;
            fastcgi_read_timeout 300s;
        }
        try_files $uri $uri/ =404;
    }
    location ^~ /office-files-internal/ {
        internal;
        alias /var/www/microads-office-data/releases/;
    }
    # <<< microads-office <<<

