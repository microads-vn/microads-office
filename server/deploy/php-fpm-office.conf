; Pool PHP-FPM riêng cho microads.vn/office (trang cập nhật Microads Office).
; Tách khỏi pool www: cho phép tải lên bộ cài ~100 MB và khóa quyền truy cập thư mục.
[microads-office]
user = www-data
group = www-data
listen = /run/php/php8.5-fpm-office.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 20s
pm.max_requests = 500

php_admin_value[open_basedir] = /var/www/microads.vn/office:/var/www/microads-office-data
php_admin_value[upload_tmp_dir] = /var/www/microads-office-data/tmp
php_admin_value[upload_max_filesize] = 300M
php_admin_value[post_max_size] = 310M
php_admin_value[max_file_uploads] = 4
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[memory_limit] = 256M
php_admin_value[date.timezone] = Asia/Ho_Chi_Minh
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_value[error_log] = /var/www/microads-office-data/logs/php-fpm.log
php_admin_value[session.save_path] = /var/www/microads-office-data/sessions
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
